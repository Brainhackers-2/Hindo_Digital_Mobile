# ============================================================
# nixpacks.toml — Build Railway pour Hindo Digital (Laravel 11)
# Base de données : Supabase PostgreSQL
# ============================================================

[phases.setup]
nixPkgs = [
  'php82',
  'php82Extensions.pdo',
  'php82Extensions.pdo_pgsql',
  'php82Extensions.pgsql',
  'php82Extensions.mbstring',
  'php82Extensions.xml',
  'php82Extensions.curl',
  'php82Extensions.gd',
  'php82Extensions.zip',
  'php82Extensions.fileinfo',
  'php82Extensions.tokenizer',
  'composer'
]

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --no-interaction'
]

[phases.build]
cmds = [
  'php artisan config:cache',
  'php artisan route:cache',
  'php artisan view:cache'
]

[start]
cmd = 'php artisan migrate --force && php artisan db:seed --class=AdminUserSeeder --force && php artisan storage:link && php -S 0.0.0.0:$PORT -t public'
